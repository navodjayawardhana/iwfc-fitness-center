<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" role="img" aria-label="FitPulse logo">
  <defs>
    <linearGradient id="fp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="0.55" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#34e0a1" />
    </linearGradient>
  </defs>
  <!-- heartbeat pulse line flowing into a dumbbell, as in the brand logo -->
  <polyline points="6,36 24,36 34,12 46,54 54,28 58,36 88,36" fill="none" stroke="url(#fp)"
            stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="94" y="12" width="12" height="40" rx="6" fill="#2ee6a8" />
  <rect x="112" y="20" width="10" height="24" rx="5" fill="#34e0a1" />
</svg>
